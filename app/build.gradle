plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'kotlin-android'
}

def getVersionCode = { ->
    try {
        def code = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'origin/main'
            standardOutput = code
        }
        return Integer.parseInt(code.toString().trim())
    }
    catch (ignored) {
        return 1
    }
}

def getVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--dirty'
            standardOutput = stdout
        }
        return stdout.toString().trim().replaceFirst("^v", "")
    }
    catch (ignored) {
        return '0.0.0'
    }
}

android {
    //noinspection GradleDependency
    compileSdk 34
    defaultConfig {
        applicationId "top.rootu.lampa"
        // D1Vision: 16 → 21 из-за встроенного libVLC (требует ≥17); парк владельца — Android TV ≥5
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode getVersionCode()
        versionName getVersionName()
        multiDexEnabled = true // required when setting minSdkVersion to 20 or lower
        // Use SupportLibrary for vectors
        vectorDrawables.useSupportLibrary = true

        // D1Vision: нативные .so libVLC — только реальные ТВ/мобилы (x86-эмулятор не нужен,
        // каждый ABI ≈ +15-25 МБ в APK)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // D1Vision: ключ периметра — из local.properties (gitignored), НЕ коммитить.
        // Строка вида: D1V_KEY_ANDROID=<hex64>. Должен совпадать с d1v.keys.android в init.conf.
        // Пусто → внешний доступ не заработает (в LAN всё равно всё открыто).
        def d1vProps = new Properties()
        def d1vFile = rootProject.file("local.properties")
        if (d1vFile.exists()) d1vFile.withInputStream { d1vProps.load(it) }
        buildConfigField "String", "d1vKey", "\"${d1vProps.getProperty('D1V_KEY_ANDROID', '')}\""

        // D1Vision: канал OTA-самообновления — подпапка в client-builds/ на сервере, она же
        // сегмент пути <host>/d1vision/apps/<канал>/... (см. helpers/Updater.kt). У ТВ-сборок
        // канал android, у телефонной — androidphone: пакеты разные, каналы не должны пересекаться,
        // иначе телефон скачал бы ТВ-APK и поставил его ОТДЕЛЬНЫМ приложением.
        buildConfigField "String", "otaPlatform", "\"android\""
        // Общий рубильник телефонных веток в общем коде (лок Live/Rec, тач-плеер, системные бары,
        // полное меню). Дефолт false — ТВ-сборки ведут себя ровно как раньше.
        buildConfigField "boolean", "phoneBuild", "false"
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropsFile = file("keystore/keystore_config")

            if (keystorePropsFile.exists()) {
                file("keystore/keystore_config").withInputStream { keystoreProperties.load(it) }
                storeFile file("$keystoreProperties.storeFile")
                storePassword "$keystoreProperties.storePassword"
                keyAlias "$keystoreProperties.keyAlias"
                keyPassword "$keystoreProperties.keyPassword"
            } else if (System.getenv('KEYSTORE_FILE')) {
                // Only wire release signing when a keystore is actually provided via env,
                // иначе file(null) падает на конфигурации ещё до debug-сборки (path='null').
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_SIGN_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_SIGN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        // https://developer.android.com/studio/write/java8-support-table
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }

    // gradle 4.6 migration: disable dimensions mechanism
    // more: https://proandroiddev.com/advanced-android-flavors-part-4-a-new-version-fc2ad80c01bb
    flavorDimensions "default"

    // Домашний Lampac-медиасервер (LAN). Зашит как стартовый адрес, чтобы приложение
    // сразу открывало наш сервер (каталог + онлайн + торренты + кнопка «Скачать» из qdl.js),
    // без диалога ввода URL при первом запуске. Меняешь сервер — правишь только эту строку.
    def defaultServerUrl = "http://192.168.87.24:9118"

    // Bootstrap-хосты D1Vision в порядке приоритета (comma-separated, БЕЗ пробелов).
    // Тот же список и тот же порядок, что у Apple-клиентов (LampaKit/Core/AppSettings.swift).
    // Первый = defaultServerUrl (LAN, primary); tv.d1versy.com — рабочий внешний вход
    // (Caddy + периметр по ключу платформы); у tv2 A-запись пока на чужом IP — проба
    // просто отваливается по таймауту. Перебор и гонка — helpers/HostResolver.kt.
    // ⚠️ Изнутри дома tv.d1versy.com НЕ отвечает (нет hairpin NAT на роутере) — поэтому
    // LAN остаётся первым: домен-primary означал бы 2.5 с ожидания на каждом старте дома.
    def fallbackHosts = "http://192.168.87.24:9118,https://tv.d1versy.com:9443,https://tv2.d1versy.com:9443"

    productFlavors {
        lite {
            // enableUpdate=true: D1Vision OTA — self-update тянет НАШ APK с сервера Lampac
            // (<host>/d1vision/apps/android/manifest.json), а не upstream GitHub. См. Updater.kt.
            buildConfigField "boolean", "enableUpdate", "true"
            buildConfigField "String", "defaultAppUrl", "\"${defaultServerUrl}\""
            buildConfigField "String", "fallbackHosts", "\"${fallbackHosts}\""
        }
        full {
            buildConfigField "boolean", "enableUpdate", "true"
            buildConfigField "String", "defaultAppUrl", "\"${defaultServerUrl}\""
            buildConfigField "String", "fallbackHosts", "\"${fallbackHosts}\""
        }
        ruStore {
            versionNameSuffix "-RuStore"
            minSdk 24 // minSdk RuStore.apk
            // enableUpdate=false: в RuStore-сборке удалён REQUEST_INSTALL_PACKAGES (запрет self-install) —
            // обновление идёт через магазин RuStore, а не через наш OTA.
            buildConfigField "boolean", "enableUpdate", "false"
            buildConfigField "String", "defaultAppUrl", "\"${defaultServerUrl}\""
            buildConfigField "String", "fallbackHosts", "\"${fallbackHosts}\""
        }
        // ── Телефонная сборка D1Vision Mobile ────────────────────────────────────────────────
        // Та же оболочка, что и ТВ-сборки (весь код общий, app/src/main), но:
        //   • свой applicationId → обе аппки живут на одном устройстве и не мешают друг другу;
        //   • свой OTA-канал → телефон обновляется телефонным APK;
        //   • phoneBuild=true → включает телефонные ветки в общем коде;
        //   • оверлей app/src/phone/ → ориентация, иконка, имя, без ТВ-компонентов.
        // Разделы «D1versy Live» / «D1versy Rec» с qdl 2.54 гейтит СЕРВЕР по айди устройства
        // (форк, Perms.cs; выдача прав — админка /admin/d1v). Клиентского лока здесь больше нет.
        // Crosswalk — как в lite (shared library), см. phoneApi в dependencies.
        phone {
            applicationIdSuffix ".phone"
            versionNameSuffix "-phone"
            // 21 → 23: несжатые .so в APK (extractNativeLibs=false, см. оверлей-манифест) умеет
            // грузить только API 23+. Нужно ради 16 KB-совместимости на современных телефонах;
            // ТВ-сборки остаются на 21 — там парк старых приставок.
            minSdk 23
            buildConfigField "boolean", "enableUpdate", "true"
            buildConfigField "String", "defaultAppUrl", "\"${defaultServerUrl}\""
            buildConfigField "String", "fallbackHosts", "\"${fallbackHosts}\""
            buildConfigField "String", "otaPlatform", "\"androidphone\""
            buildConfigField "boolean", "phoneBuild", "true"
        }
    }

    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
    }
    buildFeatures {
        viewBinding true
    }
    // Юниты обязаны падать на обращении к Android SDK, а не тихо получать нули:
    // молчаливая заглушка превратила бы тест в проверку, доказывающую свою зелёность.
    testOptions {
        unitTests.returnDefaultValues = false
        unitTests.all { test ->
            // Канарейка гейта: воркер тестов обязан видеть D1V_SELFCHECK, иначе
            // прогон -SelfCheck соврал бы, что сьюта не умеет краснеть.
            test.environment 'D1V_SELFCHECK', (System.getenv('D1V_SELFCHECK') ?: '')
        }
    }

    namespace 'top.rootu.lampa'
}

dependencies {
    // ── D1Vision: JVM-юниты (эмулятор не нужен, гоняются на любой машине) ──
    // junit той же версии, что уже подключён как implementation для совместимости
    // с Crosswalk — расхождение версий дало бы два разных Assert в одном классpath.
    testImplementation 'junit:junit:4.13.2'
    // Настоящий org.json вместо заглушки из android.jar: без него любой JSONObject
    // в юните бросает «not mocked».
    testImplementation 'org.json:json:20231013'
    // Виртуальное время для гонки хостов: единственная из трёх платформ, где её
    // можно проверить полностью детерминированно.
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"

    // https://developer.android.com/studio/write/java8-support#library-desugaring
    //noinspection GradleDependency 2.0.4 for AGP 7.4
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    def actKtxVer = '1.8.0' // 1.8.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.activity:activity-ktx:$actKtxVer"
    def appCompatVer = '1.6.1' // 1.6.1 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.appcompat:appcompat:$appCompatVer"
    def constraintVersion = '2.1.4' // 2.1.4 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.constraintlayout:constraintlayout:${constraintVersion}"
    def coreKtxVer = '1.12.0' // 1.12.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.core:core-ktx:$coreKtxVer"
    def lifecycleVersion = '2.6.2' // 2.6.2 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-process:$lifecycleVersion"
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recommendation:recommendation:1.0.0'
    //noinspection GradleDependency
    implementation 'androidx.tvprovider:tvprovider:1.0.0'
    def vectordrawableVersion = '1.1.0' // 1.1.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.vectordrawable:vectordrawable:${vectordrawableVersion}"
    def webkitVersion = '1.8.0' // 1.8.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.webkit:webkit:$webkitVersion"
    def glideVersion = '5.0.5' // glide stable
    implementation "com.github.bumptech.glide:glide:${glideVersion}"
    implementation("com.github.bumptech.glide:okhttp3-integration:${glideVersion}") {
        exclude group: 'glide-parent'
        transitive = false
    }
    ksp "com.github.bumptech.glide:ksp:${glideVersion}"
    implementation "com.github.bumptech.glide:annotations:${glideVersion}"
    def muiVersion = '1.11.0' // 1.11.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "com.google.android.material:material:${muiVersion}"
    def okhttpVersion = '3.12.13' // okhttp 3.12.13 - latest version for API < 21
    //noinspection GradleDependency
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // okhttp-dnsoverhttps убран вместе с резолвером Quad9: клиент ходит только на свой
    // сервер, а сторонний DoH видел бы даже обращения к нашему домену (см. tmdb/TMDB.kt)
    implementation 'org.brotli:dec:0.1.2'
    //noinspection GradleDependency
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kp_version" // or jdk7
    def coroutinesVersion = '1.7.3' // 1.7.3 - last compatible with kp 1.8.22
    //noinspection GradleDependency
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    //noinspection GradleDependency 2.10.x thorow java.lang.VerifyError on api17
    implementation 'com.google.code.gson:gson:2.9.1'
    def lottieVersion = '6.4.1' // lottie loaders
    //noinspection GradleDependency 6.6.2+ throw NullPointerException on build
    implementation "com.airbnb.android:lottie:$lottieVersion"
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0' // SSL / TLS
    implementation 'junit:junit:4.13.2' // For Crosswalk compatibility
    implementation 'org.conscrypt:conscrypt-android:2.5.3' // for TLS v1.3 on API < 29
    // D1Vision, только телефонная сборка: в 2.5.3 сегмент PT_GNU_RELRO у libconscrypt_jni.so
    // выровнен на 4 KB, и Android 15+ ругается «RELRO segment not aligned»; в 2.6.2 выровнен.
    // Объявлено как phoneImplementation, чтобы ТВ-сборка осталась на проверенной 2.5.3:
    // Gradle разрешит конфликт версий в пользу старшей только внутри варианта phone.
    phoneImplementation 'org.conscrypt:conscrypt-android:2.6.2'
    //noinspection GradleDependency 1.8.1 fails on build with old gradle
    implementation 'org.mozilla:rhino:1.7.15' // JavaScript to run PAC file to get correct proxies
    // D1Vision: встроенный плеер (паритет с VLCKit на mac/iOS) — см. player/PlayerActivity.kt
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    // crosswalk latest
    liteApi fileTree(dir: 'libs', include: ['xwalk_shared_library-23.53.589.4.aar'])
    ruStoreApi fileTree(dir: 'libs', include: ['xwalk_shared_library-23.53.589.4.aar'])
    fullApi fileTree(dir: 'libs', include: ['xwalk_core_library-23.53.589.4.aar'])
    // ⚠️ Обязательно: без своей строки у флавора org/xwalk/core/My*.java не компилируется
    phoneApi fileTree(dir: 'libs', include: ['xwalk_shared_library-23.53.589.4.aar'])
}